on:
  pull_request:
  push:
    branches: [pure-c-port]
name: "py-tests"
jobs:
  build:
    name: Python correctness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build loadable extension
        run: |
          cd core
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target crsqlite
          mkdir -p dist && cp build/crsqlite.so dist/crsqlite.so

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install pytest hypothesis
          cd py/correctness && pip install -e .

      - name: Test
        run: |
          cd py/correctness
          pytest -v
